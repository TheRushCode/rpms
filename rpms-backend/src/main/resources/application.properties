spring.application.name=rpms-backend

# Optional local properties import (ignored by git, safe for local credentials)
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# Server Configuration
# Render automatically injects $PORT (usually 10000 or 8080). Defaults to 8080 locally.
server.port=${PORT:8080}
server.address=0.0.0.0

# MySQL Database Connection (Configurable via DB_URL or individual properties)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kiran_academy_rpms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
# Critical rule: Never auto-create, update, or drop tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS Allowed Origins
# Comma-separated extra origins (e.g., https://my-rpms.onrender.com)
rpms.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
