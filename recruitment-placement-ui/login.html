<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Recruitment &amp; Placement Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">
  <div class="login-card">
    <div class="login-header">
      <img src="images/logo.png" alt="Kiran Academy Logo" class="login-logo">
      <h1 class="login-title">Recruitment & Placement Management System</h1>
      <p class="login-subtitle">Technology-Neutral HTML/CSS Prototype</p>
      <div class="login-auth-note">Authorized users only</div>
    </div>

    <!-- Sample Display Data: Username: recruiter@demo.com | Role: Recruiter -->
    <div class="sample-display-box"
      style="background:#eff6ff; border:1px solid #bfdbfe; border-radius:6px; padding:8px 12px; margin-bottom:18px; font-size:12px; color:#1e40af;">
      <strong>Sample Display Data:</strong> Username: recruiter@demo.com | Role: Recruiter
    </div>

    <form class="login-form" action="dashboard.html" method="get">
      <div class="form-group">
        <label for="username" class="form-label">Username / Email <span class="req">*</span></label>
        <input type="text" id="username" name="username" class="form-control" value="admin"
          placeholder="Enter username or email" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password <span class="req">*</span></label>
        <input type="password" id="password" name="password" class="form-control" value="••••••••••"
          placeholder="Enter password" required>
      </div>

      <div class="form-group">
        <label for="role" class="form-label">Role <span class="req">*</span></label>
        <select id="role" name="role" class="form-control" required>
          <option value="">-- Select Role --</option>
          <option value="Admin">Admin</option>
          <option value="Recruiter" selected>Recruiter</option>
          <option value="Placement Officer">Placement Officer</option>
        </select>
      </div>

      <div class="login-extra-row">
        <a href="#forgot-password" class="forgot-link">Forgot Password?</a>
      </div>

      <div id="login-error-msg"
        style="display:none; background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; padding:8px 12px; border-radius:6px; margin-bottom:12px; font-size:13px;">
      </div>

      <div class="login-actions">
        <button type="submit" id="loginBtn" class="btn btn-primary">Login</button>
        <button type="reset" class="btn btn-secondary">Reset</button>
      </div>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.querySelector('.login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const errBox = document.getElementById('login-error-msg');
      const btn = document.getElementById('loginBtn');
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      try {
        const res = await Api.login({ username, password, role });
        if (res && res.user) {
          localStorage.setItem('rpmsUser', JSON.stringify(res.user));
        }
        window.location.href = 'dashboard.html';
      } catch (err) {
        // Fallback for prototype direct pass-through if offline or demo credentials
        console.warn('Backend login notice:', err);
        errBox.textContent = err.message || 'Login failed. Please check credentials.';
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>
</body>

</html>
