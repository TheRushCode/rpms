# ==============================================================================
# Render Blueprint Specification for Kiran Academy RPMS
# Deploy with Render: https://dashboard.render.com/blueprints
# ==============================================================================

version: "1"

services:
  # ----------------------------------------------------------------------------
  # Backend Web Service (Spring Boot Docker Container)
  # ----------------------------------------------------------------------------
  - type: web
    name: rpms-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: rpms-backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: kiran_academy_rpms
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # ----------------------------------------------------------------------------
  # Frontend Static Site (HTML5 / CSS3 / Vanilla JS)
  # Note: Static sites are hosted on Render's CDN and do not use a compute plan.
  # ----------------------------------------------------------------------------
  - type: web
    name: rpms-frontend
    runtime: static
    staticPublishPath: recruitment-placement-ui
    routes:
      - type: redirect
        source: /
        destination: /login.html
