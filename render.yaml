# ==============================================================================
# Render Blueprint Specification for Kiran Academy RPMS
# ==============================================================================

version: "1"

services:
  # Backend Web Service (Spring Boot)
  - type: web
    name: rpms-backend
    runtime: docker
    dockerfilePath: rpms-backend/Dockerfile
    dockerContext: rpms-backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: "22608"

      - key: DB_NAME
        value: kiran_academy_rpms_migration

      - key: DB_USERNAME
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: DB_SSL_MODE
        value: REQUIRED

  # Frontend Static Site
  - type: web
    name: rpms-frontend
    runtime: static
    staticPublishPath: recruitment-placement-ui
    routes:
      - type: redirect
        source: /
        destination: /login.html